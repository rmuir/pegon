---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Scan code

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "55 5 * * 1"

permissions: {}

env:
  # Not updated by dependabot
  SEMGREP_VERSION: 1.171.0
  # Not updated by dependabot
  CHECKOV_VERSION: 3.3.8
  # Not updated by dependabot
  CARGO_DENY_VERSION: 0.20.2

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Run semgrep
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      security-events: write # integration with github advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: false
          save-cache: ${{ github.event_name != 'pull_request' }}
          cache-dependency-glob: uv.lock
          cache-suffix: semgrep-${{ env.SEMGREP_VERSION }}

      - name: Run semgrep
        run: uvx "semgrep@${SEMGREP_VERSION}" scan --oss-only --sarif-output=results.sarif
        env:
          SEMGREP_ENABLE_VERSION_CHECK: 0
          UV_EXCLUDE_NEWER: "7 days"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: semgrep

  checkov:
    name: Run checkov
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      security-events: write # integration with github advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: false
          save-cache: ${{ github.event_name != 'pull_request' }}
          cache-dependency-glob: uv.lock
          cache-suffix: checkov-${{ env.CHECKOV_VERSION }}

      - name: Run checkov
        run: uvx "checkov@${CHECKOV_VERSION}" --directory . --output sarif
        env:
          UV_EXCLUDE_NEWER: "7 days"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: checkov

  zizmor:
    name: Run zizmor
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      security-events: write # integration with github advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          persona: auditor

  deny:
    name: Run cargo deny
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      security-events: write # integration with github advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        run: rustup toolchain install

      - name: Read-only cache
        id: cache-ro
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: deny-${{ env.CARGO_DENY_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Read-write cache
        id: cache-rw
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: deny-${{ env.CARGO_DENY_VERSION }}-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo deny
        if: ${{ steps.cache-ro.outputs.cache-hit != 'true' && steps.cache-rw.outputs.cache-hit != 'true' }}
        run: cargo install --locked --version "${CARGO_DENY_VERSION}" cargo-deny

      - name: Run cargo-deny
        run: cargo deny --locked --format sarif --config .deny.toml check > results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: deny
