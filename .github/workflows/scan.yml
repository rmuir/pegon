---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Scan code

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "55 5 * * 1"

permissions: {}

env:
  # Not updated by dependabot
  SEMGREP_VERSION: 1.171.0
  # Not updated by dependabot
  CHECKOV_VERSION: 3.3.8
  # Not updated by dependabot
  CARGO_DENY_VERSION: 0.20.2

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Run semgrep
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      security-events: write # integration with github advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          prune-cache: false
          save-cache: ${{ github.event_name != 'pull_request' }}
          cache-dependency-glob: uv.lock
          cache-suffix: semgrep-${{ env.SEMGREP_VERSION }}

      - name: Run semgrep
        run: uvx "semgrep@${SEMGREP_VERSION}" scan --oss-only --sarif-output=results.sarif
        env:
          SEMGREP_ENABLE_VERSION_CHECK: 0
          UV_EXCLUDE_NEWER: "7 days"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
          category: semgrep

  checkov:
    name: Run checkov
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      security-events: write # integration with github advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          prune-cache: false
          save-cache: ${{ github.event_name != 'pull_request' }}
          cache-dependency-glob: uv.lock
          cache-suffix: checkov-${{ env.CHECKOV_VERSION }}

      - name: Run checkov
        run: uvx "checkov@${CHECKOV_VERSION}" --directory . --output sarif
        env:
          UV_EXCLUDE_NEWER: "7 days"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
          category: checkov

  zizmor:
    name: Run zizmor
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      security-events: write # integration with github advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          persona: auditor

  deny:
    name: Run cargo deny
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      security-events: write # integration with github advanced security
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        run: rustup toolchain install

      - name: Setup rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install cargo deny
        run: cargo install --debug --locked --version "${CARGO_DENY_VERSION}" cargo-deny

      - name: Run cargo-deny
        run: cargo deny --locked --format sarif --config .deny.toml check > results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
          category: deny
