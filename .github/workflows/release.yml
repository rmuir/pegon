---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release
on:
  # for dry-runs
  workflow_dispatch:
  push:
    tags: ["*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not updated by dependabot
  MATURIN_VERSION: v1.15.0
  MANYLINUX_CLANG_VERSION: 22.1.8.1
  MACOS_LLVM_VERSION: llvm@22
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  PROFILE_DIR: "${{ github.workspace }}/target/pgo-data"

jobs:
  # Creates a draft release that assets can be attached to
  create-release:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # must create a draft release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --verify-tag --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    name: "Linux ${{ matrix.maturin_target }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            maturin_target: x86_64
            docker_target: linux/amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            maturin_target: x86
            docker_target: linux/386
            target: i686-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            maturin_target: aarch64
            docker_target: linux/arm64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            maturin_target: armv7
            docker_target: linux/arm/v7
            target: armv7-unknown-linux-gnueabihf
          - runner: ubuntu-24.04-arm
            maturin_target: s390x
            docker_target: linux/s390x
            target: s390x-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            maturin_target: ppc64le
            docker_target: linux/ppc64le
            target: powerpc64le-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build instrumented
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.maturin_target }}
          args: --release --locked --out dist --compatibility pypi
          sccache: false
          manylinux: 2_28
          before-script-linux: |
            if command -v manylinux-install-clang &>/dev/null; then
              manylinux-install-clang -v ${{ env.MANYLINUX_CLANG_VERSION }}
              export PATH=/opt/clang/bin:$PATH
            else
              apt-add-repository "deb [trusted=yes] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main"
              apt update
              apt install -y clang-22
            fi
            clang --version
        env:
          RUSTFLAGS: "-Cprofile-generate=${{ env.PROFILE_DIR }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Train binary
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --platform "${DOCKER_TARGET}" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" -w "${GITHUB_WORKSPACE}" python:3.10 \
            sh -c "make corpus pgo-train TARGET=${TARGET}"
        env:
          DOCKER_TARGET: ${{ matrix.docker_target }}
          TARGET: ${{ matrix.target }}

      - name: Install llvm-profdata
        run: rustup component add llvm-tools-preview

      - name: Merge results
        run: make pgo-merge

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.maturin_target }}
          args: --release --locked --out dist --compatibility pypi
          sccache: false
          manylinux: 2_28
          before-script-linux: |
            if command -v manylinux-install-clang &>/dev/null; then
              manylinux-install-clang -v ${{ env.MANYLINUX_CLANG_VERSION }}
              export PATH=/opt/clang/bin:$PATH
            fi
            clang --version
        env:
          RUSTFLAGS: "-Cprofile-use=${{ env.PROFILE_DIR }}/merged.profdata"

      - name: Smoke-test binary
        run: |
          docker run --rm --platform "${DOCKER_TARGET}" -v "${GITHUB_WORKSPACE}:/ws" python:3.10 \
            "/ws/target/${TARGET}/release/pegon" --help
        env:
          DOCKER_TARGET: ${{ matrix.docker_target }}
          TARGET: ${{ matrix.target }}

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.maturin_target }}
          if-no-files-found: error
          path: dist

      - name: Archive binary
        run: |
          mkdir assets
          cd "target/${TARGET}/release"
          tar cvfz "../../../assets/pegon-${TARGET}.tar.gz" pegon
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ matrix.target }}
          if-no-files-found: error
          path: assets

  alpine:
    name: "Alpine ${{ matrix.maturin_target }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            maturin_target: x86_64
            docker_target: linux/amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04
            maturin_target: x86
            docker_target: linux/i386
            target: i686-unknown-linux-musl
          - runner: ubuntu-24.04
            maturin_target: aarch64
            docker_target: linux/arm64
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            maturin_target: armv7
            docker_target: linux/arm/v7
            target: armv7-unknown-linux-musleabihf
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.maturin_target }}
          args: --release --locked --out dist --compatibility pypi
          sccache: false
          manylinux: musllinux_1_2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Smoke-test binary
        run: |
          docker run --rm --platform "${DOCKER_TARGET}" -v "${GITHUB_WORKSPACE}:/ws" alpine:3.16 \
            "/ws/target/${TARGET}/release/pegon" --help
        env:
          DOCKER_TARGET: ${{ matrix.docker_target }}
          TARGET: ${{ matrix.target }}

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.maturin_target }}
          if-no-files-found: error
          path: dist

      - name: Archive binary
        run: |
          mkdir assets
          cd "target/${TARGET}/release"
          tar cvfz "../../../assets/pegon-${TARGET}.tar.gz" pegon
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ matrix.target }}
          if-no-files-found: error
          path: assets

  windows:
    name: "Windows ${{ matrix.maturin_target }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: windows-2025
            maturin_target: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-2025
            maturin_target: x86
            target: i686-pc-windows-msvc
          - runner: windows-11-arm
            maturin_target: aarch64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.maturin_target }}
          args: --release --locked --out dist --compatibility pypi
          sccache: false

      - name: Smoke-test binary
        run: |
          "target/${TARGET}/release/pegon" --help
        shell: bash
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.maturin_target }}
          if-no-files-found: error
          path: dist

      - name: Archive binary
        run: |
          mkdir assets
          cd "target/${TARGET}/release"
          7z a "../../../assets/pegon-${TARGET}.zip" pegon.exe
        shell: bash
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ matrix.target }}
          if-no-files-found: error
          path: assets

  macos:
    name: "MacOS ${{ matrix.maturin_target }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: macos-26-intel
            maturin_target: x86_64
            target: x86_64-apple-darwin
          - runner: macos-26
            maturin_target: aarch64
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang
        run: |
          brew install "${MACOS_LLVM_VERSION}"
          prefix=$(brew --prefix "${MACOS_LLVM_VERSION}")
          echo "${prefix}/bin" >> "${GITHUB_PATH}"

      - name: Report clang version
        run: clang --version

      - name: Build instrumented
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.maturin_target }}
          args: --release --locked --out dist --compatibility pypi
          sccache: false
        env:
          RUSTFLAGS: "-Cprofile-generate=${{ env.PROFILE_DIR }}"

      - name: Train binary
        run: make corpus pgo-train

      - name: Install llvm-profdata
        run: rustup component add llvm-tools-preview

      - name: Merge results
        run: make pgo-merge

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.maturin_target }}
          args: --release --locked --out dist --compatibility pypi
          sccache: false
        env:
          RUSTFLAGS: "-Cprofile-use=${{ env.PROFILE_DIR }}/merged.profdata"

      - name: Smoke-test binary
        run: |
          "target/${TARGET}/release/pegon" --help
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.maturin_target }}
          if-no-files-found: error
          path: dist

      - name: Archive binary
        run: |
          mkdir assets
          cd "target/${TARGET}/release"
          tar cvfz "../../../assets/pegon-${TARGET}.tar.gz" pegon
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-${{ matrix.target }}
          if-no-files-found: error
          path: assets

  pypi-sdist:
    name: PyPI source dist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          if-no-files-found: error
          path: dist

  # Download our built wheels, extract built binary, create native extension
  vsix-packages:
    name: Create vsix packages
    needs:
      - linux
      - alpine
      - macos
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Build vsix packages
        run: make vscode-packages

      - name: Upload vsix artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-packages
          if-no-files-found: error
          path: dist

  # Removes draft to publish the release only if everything worked
  finish-release:
    name: Finish release
    needs:
      - create-release
      - linux
      - alpine
      - macos
      - windows
      - pypi-sdist
      - vsix-packages
    outputs:
      # the actual version without the "v"
      version: ${{ steps.parse-version.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # must finalize the release
      id-token: write # sign the provenance attestation
      attestations: write # Generate attestation data
    steps:
      - name: Parse version without v
        id: parse-version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          subject-path: "assets/*"

      - name: Upload release assets
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: gh release upload "${GITHUB_REF_NAME}" ./*.tar.gz ./*.zip
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Finish release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  # Separate job for security purposes
  publish-crates:
    name: Publish to crates.io
    needs:
      - finish-release
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: crates
      url: ${{ format('https://crates.io/crates/pegon/{0}', needs.finish-release.outputs.version) }}
    permissions:
      id-token: write # required for OIDC token exchange
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Separate job for security purposes
  publish-pypi:
    name: Publish to pypi.org
    needs:
      - finish-release
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: ${{ format('https://pypi.org/project/pegon/{0}/', needs.finish-release.outputs.version) }}
    permissions:
      id-token: write # required for OIDC token exchange
      attestations: write # generate artifact attestations
      artifact-metadata: write # record artifact storage data
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "wheels-*/*"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always 'wheels-*/*'

  # Separate job for security purposes
  publish-ovsx:
    name: Publish to Open VSX
    needs:
      - finish-release
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: openvsx
      url: ${{ format('https://open-vsx.org/extension/rmuir/pegon-vscode/{0}', needs.finish-release.outputs.version) }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish to Open VSX
        run: npx ovsx publish -i vsix-packages/*.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Separate job for security purposes
  publish-vscode:
    name: Publish to VSCode
    needs:
      - finish-release
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: vscode
      url: "https://marketplace.visualstudio.com/items?itemName=rmuir.pegon-vscode"
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish to Open VSX
        run: npx @vscode/vsce publish -i vsix-packages/*.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
